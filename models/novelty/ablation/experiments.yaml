# Ablation registry. One factor changes per experiment; everything else is the base config
# (configs/experiment_config.yaml) plus `common`. Approved 2026-11-14: Batch 1, harness H1 only.
# See ablation/AUDIT_AND_PLAN.md for the reasoning behind each arm.

common:
  num_server_rounds: 30
  seeds: [42, 43, 44]
  harness:
    crn_environment: true       # H1: straggler/failure draws keyed by (seed, round, client)

# Variant keys:
#   selection:        boltzmann (default) | uniform | no_diversity
#   aggregation:      fedmelanoma (default) | no_diversity | fedavg
#   straggler_buffer: true (default) | false
#   focal_gamma:      2.0 (default) | any float
# Optional keys (blueprint v4 Section 7), stored in a run's variant only when set:
#   selection:        greedy (A3, top-K, blueprint tau -> 0)
#   attenuation:      true (default) | false (lambda = 0)
#   reliability:      ema (default) | binary (R_i = 1[on-time]) | static (R_i = 1)
#   diversity_metric: ot (default) | tv (total variation instead of optimal transport)
#   synchronous:      false (default) | true (wait for every client that completes; no buffer)
experiments:
  E00_full: {}
  E01_random_selection: {selection: uniform}
  E02_selection_no_diversity: {selection: no_diversity}
  E03_agg_no_diversity: {aggregation: no_diversity}
  E04_fedavg_weights: {aggregation: fedavg}
  E05_no_straggler_buffer: {straggler_buffer: false}
  E06_no_focal: {focal_gamma: 0.0}
  R01_fedavg_reference: {selection: uniform, aggregation: fedavg, straggler_buffer: false}
  # Blueprint v4 Section 7 (A0 = E00_full; A7 is post-hoc temperature scaling, no training run)
  A1_no_diversity: {selection: no_diversity, aggregation: no_diversity}
  A2_no_attenuation: {attenuation: false}
  A3_greedy_selection: {selection: greedy}
  A4_binary_reliability: {reliability: binary}
  A5_static_reliability: {reliability: static}
  A6_tv_diversity: {diversity_metric: tv}
  A8_synchronous: {synchronous: true}

batches:
  batch1: [E00_full, E01_random_selection, E03_agg_no_diversity, E04_fedavg_weights,
           E05_no_straggler_buffer, E06_no_focal]
  batch2: [E02_selection_no_diversity, R01_fedavg_reference]
  # Approved 2026-11-15: replaces the rest of batch1 from job a2 on (30 rounds kept).
  blueprint: [E00_full, A1_no_diversity, A2_no_attenuation, A3_greedy_selection, A4_binary_reliability,
              A5_static_reliability, A6_tv_diversity, A8_synchronous]
